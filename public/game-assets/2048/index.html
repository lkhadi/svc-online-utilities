<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .game-container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .difficulty-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .difficulty-btn {
      padding: 10px 20px;
      border: 2px solid #f59e0b;
      background: white;
      color: #f59e0b;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 0.875rem;
    }

    .difficulty-btn:hover {
      background: #f59e0b;
      color: white;
      transform: translateY(-2px);
    }

    .difficulty-btn.active {
      background: #f59e0b;
      color: white;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .game-info {
      display: flex;
      justify-content: space-around;
      padding: 15px;
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .score, .best-score {
      text-align: center;
    }

    .score label, .best-score label {
      display: block;
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 5px;
    }

    .score span, .best-score span {
      font-size: 2rem;
      font-weight: 800;
      color: #f59e0b;
    }

    .game-board {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      margin: 0 auto 20px;
      background: #bbada0;
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .cell {
      background: rgba(238, 228, 218, 0.35);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      transition: all 0.15s ease;
    }

    .cell[data-value="2"] { background: #eee4da; color: #776e65; }
    .cell[data-value="4"] { background: #ede0c8; color: #776e65; }
    .cell[data-value="8"] { background: #f2b179; color: #f9f6f2; }
    .cell[data-value="16"] { background: #f59563; color: #f9f6f2; }
    .cell[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
    .cell[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
    .cell[data-value="128"] { background: #edcf72; color: #f9f6f2; font-size: 1.75rem; }
    .cell[data-value="256"] { background: #edcc61; color: #f9f6f2; font-size: 1.75rem; }
    .cell[data-value="512"] { background: #edc850; color: #f9f6f2; font-size: 1.75rem; }
    .cell[data-value="1024"] { background: #edc53f; color: #f9f6f2; font-size: 1.5rem; }
    .cell[data-value="2048"] { background: #edc22e; color: #f9f6f2; font-size: 1.5rem; }
    .cell[data-value="4096"] { background: #3c3a32; color: #f9f6f2; font-size: 1.5rem; }
    .cell[data-value="8192"] { background: #3c3a32; color: #f9f6f2; font-size: 1.5rem; }

    .cell.new {
      animation: pop 0.2s ease;
    }

    .cell.merged {
      animation: merge 0.2s ease;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    @keyframes merge {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-content h2 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #0f172a;
    }

    .modal-content p {
      font-size: 1.125rem;
      color: #64748b;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .modal-btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
    }

    /* Analog Joystick Styles */
    .analog-joystick {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 20px auto 0;
      touch-action: none;
    }

    .joystick-base {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(145deg, #e6e6e6, #ffffff);
      border: 3px solid #d1d5db;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.1), 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    .joystick-knob {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f59e0b, #d97706);
      border: 3px solid #b45309;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: grab;
      transition: box-shadow 0.15s ease;
    }

    .joystick-knob:active {
      cursor: grabbing;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
    }

    .joystick-knob.active {
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
    }

    .direction-indicators {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .direction-indicator {
      position: absolute;
      font-size: 0.875rem;
      color: #9ca3af;
      font-weight: 600;
    }

    .direction-indicator.up { top: 8px; left: 50%; transform: translateX(-50%); }
    .direction-indicator.down { bottom: 8px; left: 50%; transform: translateX(-50%); }
    .direction-indicator.left { left: 8px; top: 50%; transform: translateY(-50%); }
    .direction-indicator.right { right: 8px; top: 50%; transform: translateY(-50%); }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .game-board {
        padding: 5px;
        gap: 5px;
      }

      .cell {
        font-size: 1.5rem;
      }

      .score span, .best-score span {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <header>
      <h1>2048</h1>
      <div class="difficulty-selector">
        <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
        <button class="difficulty-btn" data-difficulty="medium">Medium</button>
        <button class="difficulty-btn" data-difficulty="hard">Hard</button>
      </div>
      <div class="game-info">
        <div class="score">
          <label>Score</label>
          <span id="score">0</span>
        </div>
        <div class="best-score">
          <label>Best</label>
          <span id="best-score">0</span>
        </div>
      </div>
    </header>

    <div class="game-board" id="game-board"></div>

    <!-- Analog Joystick -->
    <div class="analog-joystick" id="joystick">
      <div class="joystick-base"></div>
      <div class="joystick-knob" id="joystick-knob"></div>
      <div class="direction-indicators">
        <span class="direction-indicator up">▲</span>
        <span class="direction-indicator down">▼</span>
        <span class="direction-indicator left">◀</span>
        <span class="direction-indicator right">▶</span>
      </div>
    </div>

    <div class="modal" id="game-over-modal">
      <div class="modal-content">
        <h2 id="modal-title">Game Over</h2>
        <p id="modal-message"></p>
        <button class="modal-btn" id="play-again-btn">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      board: [],
      score: 0,
      bestScore: 0,
      gameOver: false,
      gameWon: false,
      difficulty: 'easy',
      gridSize: 4
    };

    const config = {
      difficulties: {
        easy: { target: 2048, name: 'Easy' },
        medium: { target: 4096, name: 'Medium' },
        hard: { target: 8192, name: 'Hard' }
      }
    };

    function initGame() {
      state.board = Array(state.gridSize).fill(null).map(() => Array(state.gridSize).fill(0));
      state.score = 0;
      state.gameOver = false;
      state.gameWon = false;

      addRandomTile();
      addRandomTile();
      renderBoard();
      updateScore();
    }

    function addRandomTile() {
      const emptyCells = [];
      for (let i = 0; i < state.gridSize; i++) {
        for (let j = 0; j < state.gridSize; j++) {
          if (state.board[i][j] === 0) {
            emptyCells.push({ row: i, col: j });
          }
        }
      }

      if (emptyCells.length === 0) return false;

      const { row, col } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      state.board[row][col] = Math.random() < 0.9 ? 2 : 4;
      return { row, col };
    }

    function renderBoard(newTilePos = null, mergedPositions = []) {
      const gameBoard = document.getElementById('game-board');
      gameBoard.innerHTML = '';

      for (let i = 0; i < state.gridSize; i++) {
        for (let j = 0; j < state.gridSize; j++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const value = state.board[i][j];

          if (value !== 0) {
            cell.textContent = value;
            cell.dataset.value = value;

            if (newTilePos && newTilePos.row === i && newTilePos.col === j) {
              cell.classList.add('new');
            }

            if (mergedPositions.some(pos => pos.row === i && pos.col === j)) {
              cell.classList.add('merged');
            }
          }

          gameBoard.appendChild(cell);
        }
      }
    }

    function move(direction) {
      if (state.gameOver || state.gameWon) return false;

      let moved = false;
      const mergedPositions = [];
      let newTilePos = null;

      const moveRow = (row, reverse) => {
        let newRow = row.filter(val => val !== 0);
        if (reverse) newRow.reverse();

        for (let i = 0; i < newRow.length - 1; i++) {
          if (newRow[i] === newRow[i + 1]) {
            newRow[i] *= 2;
            state.score += newRow[i];
            newRow.splice(i + 1, 1);
            moved = true;

            if (newRow[i] === config.difficulties[state.difficulty].target) {
              state.gameWon = true;
            }
          }
        }

        while (newRow.length < state.gridSize) {
          newRow.push(0);
        }

        if (reverse) newRow.reverse();
        return newRow;
      };

      const oldBoard = state.board.map(row => [...row]);

      if (direction === 'left' || direction === 'right') {
        for (let i = 0; i < state.gridSize; i++) {
          state.board[i] = moveRow(state.board[i], direction === 'right');
        }
      } else {
        for (let j = 0; j < state.gridSize; j++) {
          const col = state.board.map(row => row[j]);
          const newCol = moveRow(col, direction === 'down');
          for (let i = 0; i < state.gridSize; i++) {
            state.board[i][j] = newCol[i];
          }
        }
      }

      for (let i = 0; i < state.gridSize; i++) {
        for (let j = 0; j < state.gridSize; j++) {
          if (state.board[i][j] !== oldBoard[i][j]) {
            moved = true;
            break;
          }
        }
        if (moved) break;
      }

      if (moved) {
        newTilePos = addRandomTile();
        renderBoard(newTilePos, mergedPositions);
        updateScore();

        if (state.gameWon) {
          showModal('You Win!', `You reached ${config.difficulties[state.difficulty].target}!`);
          state.gameWon = true;
        } else if (isGameOver()) {
          showModal('Game Over!', `Final score: ${state.score}`);
          state.gameOver = true;
        }
      }

      return moved;
    }

    function isGameOver() {
      for (let i = 0; i < state.gridSize; i++) {
        for (let j = 0; j < state.gridSize; j++) {
          if (state.board[i][j] === 0) return false;

          if (j < state.gridSize - 1 && state.board[i][j] === state.board[i][j + 1]) {
            return false;
          }

          if (i < state.gridSize - 1 && state.board[i][j] === state.board[i + 1][j]) {
            return false;
          }
        }
      }
      return true;
    }

    function updateScore() {
      document.getElementById('score').textContent = state.score;

      if (state.score > state.bestScore) {
        state.bestScore = state.score;
        document.getElementById('best-score').textContent = state.bestScore;
      }
    }

    function handleKeyPress(event) {
      switch (event.key) {
        case 'ArrowLeft':
        case 'a':
        case 'A':
          event.preventDefault();
          move('left');
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          event.preventDefault();
          move('right');
          break;
        case 'ArrowUp':
        case 'w':
        case 'W':
          event.preventDefault();
          move('up');
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          event.preventDefault();
          move('down');
          break;
      }
    }

    let touchStartX = 0;
    let touchStartY = 0;

    function handleTouchStart(event) {
      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
    }

    function handleTouchEnd(event) {
      const touchEndX = event.changedTouches[0].clientX;
      const touchEndY = event.changedTouches[0].clientY;

      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) move('right');
        else if (dx < -30) move('left');
      } else {
        if (dy > 30) move('down');
        else if (dy < -30) move('up');
      }
    }

    function handleDifficultyChange(event) {
      const btn = event.target.closest('.difficulty-btn');
      if (!btn) return;

      state.difficulty = btn.dataset.difficulty;

      document.querySelectorAll('.difficulty-btn').forEach(b =>
        b.classList.toggle('active', b === btn)
      );

      initGame();
    }

    function showModal(title, message) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').textContent = message;
      document.getElementById('game-over-modal').classList.add('show');
    }

    function hideModal() {
      document.getElementById('game-over-modal').classList.remove('show');
    }

    // Handle postMessage from parent (virtual joystick and game controls)
    function handlePostMessage(event) {
      if (event.data && event.data.type === 'gameControl') {
        const direction = event.data.direction;
        move(direction);
      }

      // Handle new game request from parent
      if (event.data && event.data.type === 'newGame') {
        hideModal();
        initGame();
      }
    }

    // Analog Joystick handler
    function setupAnalogJoystick() {
      const joystick = document.getElementById('joystick');
      const knob = document.getElementById('joystick-knob');
      const baseRadius = 70;
      const knobRadius = 30;
      const maxDistance = baseRadius - knobRadius;
      const deadzone = 20;

      let isActive = false;
      let lastDirection = null;
      let centerX, centerY;

      function getDirection(angle) {
        const deg = angle * (180 / Math.PI);
        if (deg >= -45 && deg < 45) return 'right';
        if (deg >= 45 && deg < 135) return 'up';
        if (deg >= -135 && deg < -45) return 'down';
        return 'left';
      }

      function updateKnob(clientX, clientY) {
        const rect = joystick.getBoundingClientRect();
        centerX = rect.left + rect.width / 2;
        centerY = rect.top + rect.height / 2;

        let deltaX = clientX - centerX;
        let deltaY = centerY - clientY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        const angle = Math.atan2(deltaY, deltaX);

        const clampedDistance = Math.min(distance, maxDistance);
        const clampedX = Math.cos(angle) * clampedDistance;
        const clampedY = -Math.sin(angle) * clampedDistance;

        knob.style.transform = `translate(calc(-50% + ${clampedX}px), calc(-50% + ${clampedY}px))`;

        // For 2048, only trigger move once when direction changes
        if (distance > deadzone) {
          const direction = getDirection(angle);
          if (direction !== lastDirection) {
            lastDirection = direction;
            move(direction);
          }
        }
      }

      function resetKnob() {
        knob.style.transform = 'translate(-50%, -50%)';
        knob.classList.remove('active');
        isActive = false;
        lastDirection = null;
      }

      joystick.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isActive = true;
        lastDirection = null;
        knob.classList.add('active');
        const touch = e.touches[0];
        updateKnob(touch.clientX, touch.clientY);
      }, { passive: false });

      joystick.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!isActive) return;
        const touch = e.touches[0];
        updateKnob(touch.clientX, touch.clientY);
      }, { passive: false });

      joystick.addEventListener('touchend', resetKnob);
      joystick.addEventListener('touchcancel', resetKnob);

      joystick.addEventListener('mousedown', (e) => {
        isActive = true;
        lastDirection = null;
        knob.classList.add('active');
        updateKnob(e.clientX, e.clientY);
      });

      document.addEventListener('mousemove', (e) => {
        if (!isActive) return;
        updateKnob(e.clientX, e.clientY);
      });

      document.addEventListener('mouseup', resetKnob);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const difficultySelector = document.querySelector('.difficulty-selector');
      const playAgainBtn = document.getElementById('play-again-btn');
      const gameBoard = document.getElementById('game-board');

      document.addEventListener('keydown', handleKeyPress);
      gameBoard.addEventListener('touchstart', handleTouchStart, { passive: true });
      gameBoard.addEventListener('touchend', handleTouchEnd, { passive: true });
      window.addEventListener('message', handlePostMessage);

      difficultySelector.addEventListener('click', handleDifficultyChange);

      playAgainBtn.addEventListener('click', () => {
        hideModal();
        initGame();
      });

      // Setup analog joystick
      setupAnalogJoystick();

      initGame();
    });
  </script>
</body>
</html>
