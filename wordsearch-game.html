<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        select {
            background: white;
        }

        button {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .stats-bar {
            display: flex;
            gap: 30px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .game-area {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .grid-container {
            flex: 1;
            min-width: 300px;
        }

        .word-grid {
            display: grid;
            gap: 2px;
            background: #e9ecef;
            padding: 10px;
            border-radius: 10px;
            user-select: none;
            touch-action: none;
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            min-width: 30px;
            min-height: 30px;
        }

        .cell:hover {
            background: #e9ecef;
        }

        .cell.selected {
            background: #667eea;
            color: white;
        }

        .cell.found {
            background: #28a745;
            color: white;
        }

        .cell.highlighted {
            background: #ffc107;
            color: #333;
        }

        .word-list-container {
            flex: 0 0 250px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        .word-list-container h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .word-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .word-item {
            padding: 8px 12px;
            background: white;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .word-item.found {
            background: #28a745;
            color: white;
            text-decoration: line-through;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-content p {
            margin-bottom: 20px;
            color: #666;
        }

        .final-score {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
            }

            .word-list-container {
                flex: none;
                width: 100%;
            }

            .header h1 {
                font-size: 22px;
            }

            .cell {
                font-size: 14px;
                min-width: 25px;
                min-height: 25px;
            }
        }
    </style>
</head>

    class WordSearchGenerator {
        constructor(gridSize, words, allowedDirections) {
            this.gridSize = gridSize;
            this.words = words;
            this.allowedDirections = allowedDirections;
            this.grid = Array(gridSize).fill(null).map(() => Array(gridSize).fill(''));
            this.placedWords = [];
            this.randomGenerator = this.seededRandom(Date.now());
        }

        seededRandom(seed) {
            return function() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            };
        }

        shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(this.randomGenerator() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        isValidPosition(row, col) {
            return row >= 0 && row < this.gridSize && col >= 0 && col < this.gridSize;
        }

        canPlaceWord(word, startRow, startCol, direction) {
            const [dRow, dCol] = direction;
            
            for (let i = 0; i < word.length; i++) {
                const newRow = startRow + i * dRow;
                const newCol = startCol + i * dCol;
                
                if (!this.isValidPosition(newRow, newCol)) {
                    return false;
                }
                
                const cell = this.grid[newRow][newCol];
                if (cell !== '' && cell !== word[i]) {
                    return false;
                }
            }
            
            return true;
        }

        placeWord(word, startRow, startCol, direction) {
            const [dRow, dCol] = direction;
            const positions = [];
            
            for (let i = 0; i < word.length; i++) {
                const newRow = startRow + i * dRow;
                const newCol = startCol + i * dCol;
                this.grid[newRow][newCol] = word[i];
                positions.push({ row: newRow, col: newCol });
            }
            
            return positions;
        }

        placeWordLinear(word) {
            const attempts = this.gridSize * this.gridSize;
            const shuffledDirections = this.shuffle([...this.allowedDirections]);
            
            for (const direction of shuffledDirections) {
                for (let attempt = 0; attempt < attempts; attempt++) {
                    const startRow = Math.floor(this.randomGenerator() * this.gridSize);
                    const startCol = Math.floor(this.randomGenerator() * this.gridSize);
                    
                    if (this.canPlaceWord(word, startRow, startCol, direction)) {
                        const positions = this.placeWord(word, startRow, startCol, direction);
                        return {
                            word: word,
                            positions: positions,
                            direction: direction,
                            found: false
                        };
                    }
                }
            }
            
            return null;
        }

        generate() {
            const shuffledWords = this.shuffle([...this.words]);
            
            for (const wordObj of shuffledWords) {
                const result = this.placeWordLinear(wordObj.word);
                if (result) {
                    this.placedWords.push(result);
                }
            }
            
            this.fillEmptyCells();
            return {
                grid: this.grid,
                placedWords: this.placedWords
            };
        }

        fillEmptyCells() {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            
            for (let row = 0; row < this.gridSize; row++) {
                for (let col = 0; col < this.gridSize; col++) {
                    if (this.grid[row][col] === '') {
                        this.grid[row][col] = letters[Math.floor(this.randomGenerator() * letters.length)];
                    }
                }
            }
        }
    }

    class ScoreTracker {
        constructor() {
            this.totalScore = 0;
            this.wordsFound = 0;
            this.penaltyCount = 0;
            this.startTime = 0;
            this.wordTimes = [];
        }

        start() {
            this.startTime = Date.now();
        }

        calculateWordScore(word, timeTaken) {
            let score = word.length * 10;
            
            const timeBonus = Math.max(0, 5000 - timeTaken) / 100;
            score += timeBonus;
            
            let multiplier = 1;
            if (word.length > 8) {
                multiplier = 1.5;
            } else if (word.length > 5) {
                multiplier = 1.2;
            }
            
            return Math.floor(score * multiplier);
        }

        addWord(word, timeTaken) {
            const wordScore = this.calculateWordScore(word, timeTaken);
            this.totalScore += wordScore;
            this.wordsFound++;
            this.wordTimes.push(timeTaken);
            return wordScore;
        }

        applyPenalty() {
            this.penaltyCount++;
            this.totalScore = Math.max(0, this.totalScore - 50);
            return -50;
        }

        getScore() {
            return this.totalScore;
        }

        getWordsFound() {
            return this.wordsFound;
        }

        getPenaltyCount() {
            return this.penaltyCount;
        }

        reset() {
            this.totalScore = 0;
            this.wordsFound = 0;
            this.penaltyCount = 0;
            this.startTime = 0;
            this.wordTimes = [];
        }
    }

    class GameTimer {
        constructor() {
            this.timeLimit = null;
            this.timeRemaining = 0;
            this.isRunning = false;
            this.intervalId = null;
            this.elapsedTime = 0;
            this.startTime = 0;
            this.mode = 'classic';
        }

        setMode(mode) {
            this.mode = mode;
            switch (mode) {
                case 'timed':
                    this.timeLimit = 5 * 60;
                    break;
                case 'blitz':
                    this.timeLimit = 60;
                    break;
                case 'zen':
                case 'classic':
                    this.timeLimit = null;
                    break;
                default:
                    this.timeLimit = null;
            }
        }

        start() {
            this.isRunning = true;
            this.startTime = Date.now();
            this.elapsedTime = 0;
            
            if (this.timeLimit) {
                this.timeRemaining = this.timeLimit;
            }
            
            this.intervalId = setInterval(() => {
                this.update();
            }, 100);
        }

        stop() {
            this.isRunning = false;
            if (this.intervalId) {
                clearInterval(this.intervalId);
                this.intervalId = null;
            }
        }

        reset() {
            this.stop();
            this.elapsedTime = 0;
            this.startTime = 0;
            if (this.timeLimit) {
                this.timeRemaining = this.timeLimit;
            }
        }

        update() {
            const now = Date.now();
            this.elapsedTime = Math.floor((now - this.startTime) / 1000);
            
            if (this.timeLimit) {
                this.timeRemaining = Math.max(0, this.timeLimit - this.elapsedTime);
                
                if (this.timeRemaining <= 0) {
                    this.stop();
                    return false;
                }
            }
            
            return true;
        }

        getTimeString() {
            const time = this.timeLimit ? this.timeRemaining : this.elapsedTime;
            const minutes = Math.floor(time / 60);
            const seconds = time % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        getTimeInSeconds() {
            return this.timeLimit ? this.timeRemaining : this.elapsedTime;
        }

        isExpired() {
            return this.timeLimit !== null && this.timeRemaining <= 0;
        }

        hasTimeLimit() {
            return this.timeLimit !== null;
        }

        getTimeRemaining() {
            return this.timeRemaining;
        }

        getElapsedTime() {
            return this.elapsedTime;
        }
    }

    class WordSelector {
        constructor(gridElement, onSelectionComplete) {
            this.gridElement = gridElement;
            this.onSelectionComplete = onSelectionComplete;
            this.isSelecting = false;
            this.startCell = null;
            this.currentCell = null;
            this.selectedCells = [];
            this.gridSize = 0;
            this.cells = [];
            this.touchStartX = 0;
            this.touchStartY = 0;
        }

        initialize(gridSize) {
            this.gridSize = gridSize;
            this.gridElement.innerHTML = '';
            this.gridElement.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            this.cells = [];
            
            for (let row = 0; row < gridSize; row++) {
                const rowCells = [];
                for (let col = 0; col < gridSize; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    this.gridElement.appendChild(cell);
                    rowCells.push(cell);
                }
                this.cells.push(rowCells);
            }
            
            this.addEventListeners();
        }

        addEventListeners() {
            this.gridElement.addEventListener('mousedown', (e) => this.handleMouseDown(e));
            document.addEventListener('mousemove', (e) => this.handleMouseMove(e));
            document.addEventListener('mouseup', (e) => this.handleMouseUp(e));
            
            this.gridElement.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: false });
            document.addEventListener('touchmove', (e) => this.handleTouchMove(e), { passive: false });
            document.addEventListener('touchend', (e) => this.handleTouchEnd(e), { passive: false });
        }

        removeEventListeners() {
            this.gridElement.removeEventListener('mousedown', (e) => this.handleMouseDown(e));
            document.removeEventListener('mousemove', (e) => this.handleMouseMove(e));
            document.removeEventListener('mouseup', (e) => this.handleMouseUp(e));
            
            this.gridElement.removeEventListener('touchstart', (e) => this.handleTouchStart(e));
            document.removeEventListener('touchmove', (e) => this.handleTouchMove(e));
            document.removeEventListener('touchend', (e) => this.handleTouchEnd(e));
        }

        getCellFromEvent(e) {
            const target = e.target.closest('.cell');
            if (!target) return null;
            
            const row = parseInt(target.dataset.row);
            const col = parseInt(target.dataset.col);
            return { cell: target, row, col };
        }

        handleMouseDown(e) {
            e.preventDefault();
            const result = this.getCellFromEvent(e);
            if (!result) return;
            
            this.isSelecting = true;
            this.startCell = result;
            this.currentCell = result;
            this.updateSelection();
        }

        handleMouseMove(e) {
            if (!this.isSelecting) return;
            
            const result = this.getCellFromEvent(e);
            if (!result) return;
            
            this.currentCell = result;
            this.updateSelection();
        }

        handleMouseUp(e) {
            if (!this.isSelecting) return;
            
            this.isSelecting = false;
            this.completeSelection();
        }

        handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            this.touchStartX = touch.clientX;
            this.touchStartY = touch.clientY;
            
            const result = this.getCellFromEvent(e);
            if (!result) return;
            
            this.isSelecting = true;
            this.startCell = result;
            this.currentCell = result;
            this.updateSelection();
        }

        handleTouchMove(e) {
            if (!this.isSelecting) return;
            e.preventDefault();
            
            const touch = e.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (!target || !target.classList.contains('cell')) return;
            
            const row = parseInt(target.dataset.row);
            const col = parseInt(target.dataset.col);
            
            this.currentCell = { cell: target, row, col };
            this.updateSelection();
        }

        handleTouchEnd(e) {
            if (!this.isSelecting) return;
            e.preventDefault();
            
            this.isSelecting = false;
            this.completeSelection();
        }

        updateSelection() {
            this.clearHighlight();
            
            if (!this.startCell || !this.currentCell) return;
            
            const cells = this.getLineCells(this.startCell, this.currentCell);
            
            if (cells) {
                this.selectedCells = cells;
                cells.forEach(({ row, col }) => {
                    this.cells[row][col].classList.add('selected');
                });
            } else {
                this.selectedCells = [];
            }
        }

        getLineCells(start, end) {
            const dRow = end.row - start.row;
            const dCol = end.col - start.col;
            
            if (dRow === 0 && dCol === 0) {
                return [{ row: start.row, col: start.col }];
            }
            
            const steps = Math.max(Math.abs(dRow), Math.abs(dCol));
            const stepRow = dRow === 0 ? 0 : dRow / Math.abs(dRow);
            const stepCol = dCol === 0 ? 0 : dCol / Math.abs(dCol);
            
            if (dRow !== 0 && dCol !== 0 && Math.abs(dRow) !== Math.abs(dCol)) {
                return null;
            }
            
            const cells = [];
            for (let i = 0; i <= steps; i++) {
                cells.push({
                    row: start.row + i * stepRow,
                    col: start.col + i * stepCol
                });
            }
            
            return cells;
        }

        clearHighlight() {
            this.selectedCells.forEach(({ row, col }) => {
                this.cells[row][col].classList.remove('selected', 'highlighted');
            });
            this.selectedCells = [];
        }

        completeSelection() {
            const word = this.selectedCells.map(({ row, col }) => {
                return this.cells[row][col].textContent;
            }).join('');
            
            const reverseWord = word.split('').reverse().join('');
            
            this.onSelectionComplete({
                word: word,
                reverseWord: reverseWord,
                cells: [...this.selectedCells]
            });
            
            this.clearHighlight();
            this.startCell = null;
            this.currentCell = null;
        }

        updateGrid(letters, foundWords) {
            for (let row = 0; row < this.gridSize; row++) {
                for (let col = 0; col < this.gridSize; col++) {
                    this.cells[row][col].textContent = letters[row][col];
                }
            }
            
            foundWords.forEach(wordObj => {
                if (wordObj.found) {
                    wordObj.positions.forEach(({ row, col }) => {
                        this.cells[row][col].classList.add('found');
                    });
                }
            });
        }

        highlightFoundWord(positions) {
            positions.forEach(({ row, col }) => {
                this.cells[row][col].classList.add('found');
            });
        }

        highlightInvalidSelection() {
            this.selectedCells.forEach(({ row, col }) => {
                this.cells[row][col].classList.add('highlighted');
            });
            setTimeout(() => {
                this.clearHighlight();
            }, 500);
        }

        reset() {
            this.clearHighlight();
            this.isSelecting = false;
            this.startCell = null;
            this.currentCell = null;
        }
    }

    class GameState {
        constructor() {
            this.localization = new LocalizationManager();
            this.scoreTracker = new ScoreTracker();
            this.timer = new GameTimer();
            this.wordSelector = null;
            this.currentGrid = null;
            this.placedWords = [];
            this.gameMode = 'classic';
            this.difficulty = 'beginner';
            this.language = 'en';
            this.isGameOver = false;
            this.isPaused = false;
        }

        initialize() {
            const gridElement = document.getElementById('word-grid');
            this.wordSelector = new WordSelector(gridElement, (selection) => this.handleSelection(selection));
            this.setupEventListeners();
            this.updateUI();
        }

        setupEventListeners() {
            document.getElementById('language-select').addEventListener('change', (e) => {
                this.language = e.target.value;
                this.localization.setLanguage(this.language);
                this.updateUI();
            });

            document.getElementById('mode-select').addEventListener('change', (e) => {
                this.gameMode = e.target.value;
            });

            document.getElementById('difficulty-select').addEventListener('change', (e) => {
                this.difficulty = e.target.value;
            });

            document.getElementById('new-game-btn').addEventListener('click', () => {
                this.startNewGame();
            });

            document.getElementById('play-again-btn').addEventListener('click', () => {
                document.getElementById('game-over-modal').classList.remove('show');
                this.startNewGame();
            });
        }

        getWordDifficulty() {
            const mapping = {
                beginner: 'easy',
                easy: 'easy',
                medium: 'medium',
                hard: 'hard',
                expert: 'hard'
            };
            return mapping[this.difficulty] || 'easy';
        }

        startNewGame() {
            this.isGameOver = false;
            this.isPaused = false;
            this.scoreTracker.reset();
            this.timer.setMode(this.gameMode);
            this.timer.reset();
            
            const config = difficultyConfig[this.difficulty];
            const wordDifficulty = this.getWordDifficulty();
            const availableWords = wordDatabase[this.language][wordDifficulty];
            
            const shuffledWords = [...availableWords].sort(() => Math.random() - 0.5);
            const selectedWords = shuffledWords.slice(0, Math.min(config.wordCount, availableWords.length));
            
            const words = selectedWords.map(w => w.word);
            
            const generator = new WordSearchGenerator(config.gridSize, words, config.directions);
            const result = generator.generate();
            
            this.currentGrid = result.grid;
            this.placedWords = result.placedWords;
            
            this.wordSelector.initialize(config.gridSize);
            this.wordSelector.updateGrid(this.currentGrid, this.placedWords);
            
            this.updateWordList();
            this.updateStats();
            
            this.timer.start();
            this.scoreTracker.start();
            
            this.startGameLoop();
        }

        startGameLoop() {
            const gameLoop = setInterval(() => {
                if (this.isGameOver || this.isPaused) {
                    clearInterval(gameLoop);
                    return;
                }
                
                this.timer.update();
                this.updateStats();
                
                if (this.timer.isExpired()) {
                    this.endGame(false);
                    clearInterval(gameLoop);
                }
            }, 100);
        }

        handleSelection(selection) {
            if (this.isGameOver || this.isPaused) return;
            
            const foundWord = this.placedWords.find(w => 
                (w.word === selection.word || w.word === selection.reverseWord) && !w.found
            );
            
            if (foundWord) {
                const timeTaken = this.timer.getElapsedTime() * 1000;
                const score = this.scoreTracker.addWord(foundWord.word, timeTaken);
                
                foundWord.found = true;
                this.wordSelector.highlightFoundWord(foundWord.positions);
                this.updateWordList();
                this.updateStats();
                
                if (this.checkAllWordsFound()) {
                    this.endGame(true);
                }
            } else {
                this.scoreTracker.applyPenalty();
                this.wordSelector.highlightInvalidSelection();
                this.updateStats();
            }
        }

        checkAllWordsFound() {
            return this.placedWords.every(w => w.found);
        }

        updateWordList() {
            const listElement = document.getElementById('word-list');
            listElement.innerHTML = '';
            
            this.placedWords.forEach(wordObj => {
                const li = document.createElement('li');
                li.className = 'word-item' + (wordObj.found ? ' found' : '');
                li.textContent = wordObj.word;
                listElement.appendChild(li);
            });
        }

        updateStats() {
            document.getElementById('score-value').textContent = this.scoreTracker.getScore();
            document.getElementById('timer-value').textContent = this.timer.getTimeString();
            document.getElementById('words-value').textContent = 
                `${this.scoreTracker.getWordsFound()}/${this.placedWords.length}`;
        }

        updateUI() {
            document.getElementById('game-title').textContent = this.localization.get('gameTitle');
            document.getElementById('score-label').textContent = this.localization.get('scoreLabel');
            document.getElementById('timer-label').textContent = this.localization.get('timerLabel');
            document.getElementById('words-label').textContent = this.localization.get('wordsLabel');
            document.getElementById('word-list-title').textContent = this.localization.get('wordListTitle');
            document.getElementById('new-game-btn').textContent = this.localization.get('newGameBtn');
            document.getElementById('modal-title').textContent = this.localization.get('gameOverTitle');
            document.getElementById('modal-message').textContent = this.localization.get('modalMessage');
            document.getElementById('play-again-btn').textContent = this.localization.get('playAgainBtn');
        }

        endGame(won) {
            this.isGameOver = true;
            this.timer.stop();
            
            document.getElementById('modal-title').textContent = won ? 
                (this.language === 'id' ? 'Selamat!' : 'Congratulations!') : 
                this.localization.get('gameOverTitle');
            
            document.getElementById('modal-message').textContent = won ?
                (this.language === 'id' ? 'Anda menemukan semua kata!' : 'You found all the words!') :
                (this.language === 'id' ? 'Waktu habis!' : 'Time\'s up!');
            
            document.getElementById('final-score').textContent = this.scoreTracker.getScore();
            document.getElementById('game-over-modal').classList.add('show');
        }

        pause() {
            if (this.isGameOver) return;
            this.isPaused = true;
            this.timer.stop();
        }

        resume() {
            if (this.isGameOver || !this.isPaused) return;
            this.isPaused = false;
            this.timer.start();
        }

        getGridSize() {
            return difficultyConfig[this.difficulty].gridSize;
        }

        getWordCount() {
            return difficultyConfig[this.difficulty].wordCount;
        }

        getCurrentScore() {
            return this.scoreTracker.getScore();
        }

        getTimeRemaining() {
            return this.timer.getTimeRemaining();
        }

        isGameRunning() {
            return !this.isGameOver && !this.isPaused;
        }

        getFoundWords() {
            return this.placedWords.filter(w => w.found);
        }

        getRemainingWords() {
            return this.placedWords.filter(w => !w.found);
        }
    }

    const gameState = new GameState();
    gameState.initialize();
    gameState.startNewGame();
    </script>
